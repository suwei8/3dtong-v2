name: daily predict
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "configs/opencode_models.json"
      - "requirements.txt"
      - ".github/workflows/daily-predict.yml"
  schedule:
    - cron: "50 11 * * *" # 19:50 Beijing
    - cron: "20 12 * * *" # 20:20 Beijing
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-predict-main
  cancel-in-progress: false
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Refresh main before checkout
        run: git pull --ff-only origin main
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: suwei8/pinble-data
          token: ${{ secrets.PINBLE_DATA_TOKEN }}
          path: private-source
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Test all pipeline modules
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q tests/
      - name: Enforce cutoff in Beijing timezone
        run: |
          hhmm=$(TZ=Asia/Shanghai date +%H%M)
          if [ "$hhmm" -ge 2110 ]; then
            echo "::error::Past Beijing 21:10; refusing to generate predictions."
            exit 1
          fi
      - name: Identify next issue and avoid duplicate OpenCode costs
        id: target
        run: |
          next=$(python -c "from src.data.live import load_live_history; print(load_live_history('private-source/data/k3_full_history.csv')['target'])")
          echo "issue=$next" >> "$GITHUB_OUTPUT"
          if [ -f "predictions/live/runs/$next.json" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Forecast already frozen: $next"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "New prospective target: $next"
          fi
      - name: Install OpenCode free CLI without authentication
        if: steps.target.outputs.new == 'true'
        run: npm install -g opencode-ai
      - name: Run nine optional free-model contestants and freeze prediction
        if: steps.target.outputs.new == 'true'
        run: |
          source_commit=$(git -C private-source log -1 --format=%cI -- data/k3_full_history.csv)
          python -m src.pipeline.live \
            --history private-source/data/k3_full_history.csv \
            --max-source-age-hours 36 \
            --source-commit-utc "$source_commit" \
            --opencode
      - name: Verify publish deadline again after all models finish
        if: steps.target.outputs.new == 'true'
        run: |
          hhmm=$(TZ=Asia/Shanghai date +%H%M)
          if [ "$hhmm" -ge 2110 ]; then
            echo "::error::Model run finished after Beijing 21:10, refuse publish."
            exit 1
          fi
      - name: Publish only sealed forecast and no private data
        if: steps.target.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git cat-file -e "origin/main:predictions/live/runs/${{ steps.target.outputs.issue }}.json" 2>/dev/null; then
            echo "Another workflow already froze this issue; leaving original unchanged."
            exit 0
          fi
          git add predictions/live/LATEST.md predictions/live/runs/
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "forecast: sealed issue with OpenCode contestants [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
