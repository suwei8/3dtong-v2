name: daily predict
on:
  schedule:
    - cron: "30 16 * * *" # 00:30 Beijing next morning; overnight source should be ready
    - cron: "20 22 * * *" # 06:20 Beijing
    - cron: "20 4 * * *"  # 12:20 Beijing
    - cron: "20 9 * * *"  # 17:20 Beijing
    - cron: "50 11 * * *" # 19:50 Beijing
    - cron: "20 12 * * *" # 20:20 Beijing
    - cron: "40 12 * * *" # 20:40 Beijing failover attempt; duplicate issue is skipped
  repository_dispatch:
    types: [pinble_history_updated]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-predict-main
  cancel-in-progress: false
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Refresh main before checkout
        run: git pull --ff-only origin main
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: suwei8/pinble-data
          token: ${{ secrets.PINBLE_DATA_TOKEN }}
          path: private-source
          ref: main
          persist-credentials: false
          fetch-depth: 0 # Required for accurate last-change timestamp of the CSV (not repository HEAD)
      - name: Verify trusted source-commit trigger (no private draw payload)
        if: github.event_name == 'repository_dispatch'
        env:
          SOURCE_COMMIT: ${{ github.event.client_payload.source_commit }}
        run: |
          if ! [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Invalid source-commit SHA in cross-repository dispatch"
            exit 1
          fi
          git -C private-source cat-file -e "$SOURCE_COMMIT^{commit}"
          git -C private-source merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          if ! git -C private-source diff-tree --no-commit-id --name-only -r "$SOURCE_COMMIT" \
            | grep -Fxq 'data/k3_full_history.csv'; then
            echo "::error::Source event did not update historical CSV"
            exit 1
          fi
      - name: Fast pure-Python source freshness / target / Beijing deadline preflight
        id: target
        run: |
          source_commit=$(git -C private-source log -1 --format=%cI -- data/k3_full_history.csv)
          python -m src.pipeline.preflight \
            --history private-source/data/k3_full_history.csv \
            --forecasts predictions/live/runs \
            --source-commit-utc "$source_commit" \
            --max-source-age-hours 24 \
            --deadline-beijing 21:10 \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.target.outputs.new == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - name: Install production runtime only (CI runs full tests on push)
        if: steps.target.outputs.new == 'true'
        run: python -m pip install -r requirements.txt
      - name: Freeze classical ML and random-control forecast first
        if: steps.target.outputs.new == 'true'
        run: |
          source_commit=$(git -C private-source log -1 --format=%cI -- data/k3_full_history.csv)
          python -m src.pipeline.live \
            --history private-source/data/k3_full_history.csv \
            --max-source-age-hours 24 \
            --source-commit-utc "$source_commit"
      - name: Render readable historical prediction archive
        if: steps.target.outputs.new == 'true'
        run: python -m src.pipeline.render_history --forecasts predictions/live/runs --scores reports/live --out predictions/live/HISTORY.md --details-dir predictions/live/history
      - name: Verify publish deadline again after all models finish
        if: steps.target.outputs.new == 'true'
        run: |
          hhmm=$(TZ=Asia/Shanghai date +%H%M)
          if [ "$hhmm" -ge 2110 ]; then
            echo "::error::Model run finished after Beijing 21:10, refuse publish."
            exit 1
          fi
      - name: Publish only sealed forecast and no private data
        if: steps.target.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git cat-file -e "origin/main:predictions/live/runs/${{ steps.target.outputs.issue }}.json" 2>/dev/null; then
            echo "Another workflow already froze this issue; leaving original unchanged."
            exit 0
          fi
          git add predictions/live/LATEST.md predictions/live/HISTORY.md predictions/live/history/ predictions/live/runs/
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "forecast: seal classical ML before optional OpenCode [skip ci]"
            git pull --rebase origin main
            hhmm=$(TZ=Asia/Shanghai date +%H%M)
            if [ "$hhmm" -ge 2110 ]; then
              echo "::error::Publication deadline passed during Git rebase; refusing late push."
              exit 1
            fi
            git push origin HEAD:main
          fi
