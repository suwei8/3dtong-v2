name: Kilo free-model diagnostics

# Verifies, with RAW provider evidence, whether anonymous Kilo free models
# work from a clean GitHub Actions runner. Keeps the real error events and
# diffs the live `kilo models` catalogue against configs/kilo_models.json.
# Results are uploaded as artifacts and shown in the step summary only —
# raw gateway text is never committed to the repository.

on:
  push:
    branches: [main]
    paths:
      - "src/pipeline/kilo_diagnose.py"
      - "configs/kilo_models.json"
      - ".github/workflows/kilo-diagnose.yml"
  workflow_dispatch:
    inputs:
      cli_version:
        description: Kilo CLI version to install (e.g. 7.8.27 or latest)
        required: false
        default: "7.8.27"
      timeout:
        description: Per-model probe timeout in seconds (5-300)
        required: false
        default: "60"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: kilo-diagnose-${{ inputs.cli_version || github.event_name }}-${{ matrix.cli_version }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        cli_version:
          - ${{ github.event.inputs.cli_version || '7.8.27' }}
          - latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Network baseline (egress IP, ASN, gateway reachability)
        run: |
          {
            echo "### Egress identity"
            echo '```'
            curl -fsS --max-time 10 "https://api.ipify.org?format=json" || echo "ipify unreachable"
            echo
            curl -fsS --max-time 10 "https://ipinfo.io/json" || echo "ipinfo unreachable"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Kilo CLI (${{ matrix.cli_version }})
        run: |
          npm view @kilocode/cli version | sed 's/^/npm latest: /' || true
          npm install -g --allow-scripts=@kilocode/cli "@kilocode/cli@${{ matrix.cli_version }}"
          kilo --version
          if ! kilo --version | grep -Eq '(^|[[:space:]]|v)7\.'; then
            echo "::error::Expected Kilo CLI v7; free catalogue requires v7"
            exit 1
          fi
          echo "### auth list (expect empty: anonymous)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kilo auth list >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Probe configured and discovered free models with raw evidence
        env:
          PROBE_TIMEOUT: ${{ github.event.inputs.timeout || '60' }}
        run: |
          set -o pipefail
          python -m src.pipeline.kilo_diagnose \
            --out reports/kilo-diagnose.json \
            --timeout "$PROBE_TIMEOUT" \
            | tee "$RUNNER_TEMP/diagnose-summary.md"
          {
            echo "## CLI ${{ matrix.cli_version }}"
            cat "$RUNNER_TEMP/diagnose-summary.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw diagnostic evidence (artifact only, never committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kilo-diagnose-${{ matrix.cli_version }}-${{ strategy.job-index }}
          path: reports/kilo-diagnose.json
          if-no-files-found: warn
