name: optional Kilo forecasts

on:
  workflow_run:
    workflows: ["daily predict"]
    types: [completed]
  schedule:
    - cron: "10 12 * * *" # Beijing 20:10 safety retry
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optional-kilo-main
  cancel-in-progress: false

jobs:
  vote:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: suwei8/pinble-data
          token: ${{ secrets.PINBLE_DATA_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable classical forecast Git history
        run: python -m src.pipeline.seal --forecasts predictions/live/runs
      - name: Preflight import smoke test with no site-packages
        run: python -S -m src.pipeline.kilo_live --help
      - name: Check target, parent seal and deadline before installing Kilo
        id: target
        run: |
          source_commit=$(git -C private-source log -1 --format=%cI -- data/k3_full_history.csv)
          python -m src.pipeline.kilo_live \
            --history private-source/data/k3_full_history.csv \
            --source-commit-utc "$source_commit" \
            --preflight --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.target.outputs.new == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - name: Install local runtime and anonymous optional Kilo CLI
        if: steps.target.outputs.new == 'true'
        run: |
          python -m pip install -r requirements.txt
          if ! timeout 120s npm install -g --allow-scripts=@kilocode/cli @kilocode/cli@7.8.27; then
            echo "::warning::Kilo CLI unavailable; optional votes will record skipped status."
          elif command -v kilo >/dev/null 2>&1; then
            kilo --version
            if ! kilo --version | grep -Eq '(^|[[:space:]]|v)7\.'; then
              echo "::error::Expected Kilo CLI v7; refusing unexpected catalogue"
              exit 1
            fi
          else
            echo "::warning::Kilo binary missing after install."
          fi
      - name: Independently freeze optional Kilo contestants
        if: steps.target.outputs.new == 'true'
        run: |
          source_commit=$(git -C private-source log -1 --format=%cI -- data/k3_full_history.csv)
          python -m src.pipeline.kilo_live \
            --history private-source/data/k3_full_history.csv \
            --source-commit-utc "$source_commit" \
            --max-seconds 240
      - name: Refresh README after independent optional votes
        if: steps.target.outputs.new == 'true'
        run: |
          if [ -f "predictions/live/kilo-runs/${{ steps.target.outputs.issue }}.json" ]; then
            python -m src.pipeline.readme_latest
          fi
      - name: Publish only optional immutable issue file
        if: steps.target.outputs.new == 'true'
        env:
          TARGET_ISSUE: ${{ steps.target.outputs.issue }}
        run: |
          set -e
          file="predictions/live/kilo-runs/$TARGET_ISSUE.json"
          if [ ! -f "$file" ]; then
            echo "No pre-result optional record; skipping"
            exit 0
          fi
          if [ "$(TZ=Asia/Shanghai date +%H%M)" -ge 2110 ]; then
            echo "::warning::Kilo deadline exceeded; optional votes not published."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git cat-file -e "origin/main:$file" 2>/dev/null; then
            echo "Another workflow sealed optional issue first."
            exit 0
          fi
          git add -- "$file" README.md
          git commit -m "kilo: independently seal optional votes [skip ci]"
          git pull --rebase origin main
          if [ "$(TZ=Asia/Shanghai date +%H%M)" -ge 2110 ]; then
            echo "::warning::Late after rebase; refusing optional push"
            exit 0
          fi
          git push origin HEAD:main
