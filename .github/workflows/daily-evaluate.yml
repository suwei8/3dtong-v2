name: daily evaluate
on:
  workflow_run:
    workflows: ["daily predict"]
    types: [completed]
  schedule:
    - cron: "45 13 * * *" # Beijing 21:45
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-evaluate-main
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest public predictions
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Checkout full PRIVATE results only for scoring
        uses: actions/checkout@v4
        with:
          repository: suwei8/pinble-data
          token: ${{ secrets.PINBLE_DATA_TOKEN }}
          path: private-source
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Score predictions already saved in Git history
        run: |
          python -m src.pipeline.evaluate \
            --full-history private-source/data/k3_full_history.csv \
            --predictions predictions/runs \
            --reports reports
      - name: Commit only public summary metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/leaderboard.md reports/evaluations/
          if git diff --cached --quiet; then
            echo "No changed outcomes"
          else
            git commit -m "evaluation: score frozen predictions [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
