name: daily evaluate

on:
  push:
    branches: [main]
    paths:
      - "src/pipeline/evaluate_live.py"
      - "src/pipeline/render_history.py"
      - ".github/workflows/daily-evaluate.yml"
  workflow_run:
    workflows: ["daily predict"]
    types: [completed]
  schedule:
    - cron: "45 13 * * *" # Beijing 21:45
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-evaluate-main
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Read private completed draw results
        uses: actions/checkout@v4
        with:
          repository: suwei8/pinble-data
          token: ${{ secrets.PINBLE_DATA_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Git seal and original publication history
        run: python -m src.pipeline.seal --forecasts predictions/live/runs
      - name: Score ONLY sealed prospective issues
        run: |
          python -m src.pipeline.evaluate_live \
            --full-history private-source/data/k3_full_history.csv \
            --forecasts predictions/live/runs \
            --out reports
      - name: Render readable historical prediction archive
        run: python -m src.pipeline.render_history --forecasts predictions/live/runs --scores reports/live --out predictions/live/HISTORY.md --details-dir predictions/live/history
      - name: Commit aggregate scores only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/live-leaderboard.md reports/live-metrics.json reports/research.json reports/research.md reports/live/ predictions/live/HISTORY.md predictions/live/history/
          if git diff --cached --quiet; then
            echo "No new completed live draws."
          else
            git commit -m "evaluation: score previously sealed prospective issues [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
