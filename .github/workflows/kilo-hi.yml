name: kilo run "hi" — raw truth
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install latest Kilo CLI
        run: |
          npm install -g --allow-scripts=@kilocode/cli @kilocode/cli@latest
          kilo --version

      - name: kilo run "hi"
        run: |
          set -x
          kilo run "hi" || rc=$?
          echo "EXIT_CODE=${rc:-0}"
          exit 0

      - name: same call, JSON event stream (shows error.type if any)
        if: always()
        run: |
          set -x
          kilo run --format json "hi" || rc=$?
          echo "JSON_EXIT_CODE=${rc:-0}"
          exit 0
